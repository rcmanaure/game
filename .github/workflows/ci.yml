name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck (harness)
        run: npx tsc --noEmit -p tsconfig.json
      - name: Harness tests
        run: npm test
      - name: Typecheck (backend)
        run: npx tsc --noEmit -p tsconfig.backend.json

      # ponytail: backend TYPECHECK is now gated (tsconfig.backend.json rootDir
      # fixed to "src", __tests__ excluded -- it needs no jest install). Backend
      # TESTS still are not: npm test globs src/harness/__tests__/*.test.ts only,
      # and src/backend/graph/__tests__ needs jest / @types/jest / @nestjs/testing.
      # Green here means both source trees COMPILE; it does not mean the backend
      # works against real Postgres -- nothing here touches a database.
      # Re-enable the remaining half once TODO.md M3.1 lands:
      #   npm run test:backend
      #
      # ponytail: node-version pinned to 24 LTS. Dev runs 26.5, @types/node is ^22.
      # Three versions, none enforced. Consolidate via engines or .nvmrc if the
      # skew ever produces a real failure.
