name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck (harness)
        run: npx tsc --noEmit -p tsconfig.json
      - name: Harness tests
        run: npm test
      - name: Typecheck (backend)
        run: npx tsc --noEmit -p tsconfig.backend.json
      - name: Backend tests
        run: npm run test:backend

      # M3.1 (2026-08-13): jest / @types/jest / ts-jest / @nestjs/testing
      # installed, jest.backend.config.cjs added, backend tests now run
      # here — closes the gap this comment used to describe. Still true:
      # nothing in this workflow touches a real Postgres, so "backend
      # tests pass" is unit-level confidence, not the live-DB verification
      # this session did manually (see CHANGELOG [0.1.1.0]).
      #
      # ponytail: node-version pinned to 24 LTS. Dev runs 26.5, @types/node is ^22.
      # Three versions, none enforced. Consolidate via engines or .nvmrc if the
      # skew ever produces a real failure.
